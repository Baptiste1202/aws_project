# nginx joue le rôle de CloudFront en local : un bloc server par distribution
# (même routage que cdn.tf et hybrid.tf).
#   8081 : solution serverless   /*  -> front statique
#                                /api/* -> Lambda "api" (Function URL)
#   8082 : solution hybride      /*  -> front statique
#                                /api/* en GET/HEAD -> Lambda "hybrid-read" (Function URL)
#                                /api/* autres méthodes -> EC2 hybride (app.py, base shop_hybrid)
# Le front est servi depuis src/frontend (monté en lecture seule), comme le bucket S3.
# Les Function URL de LocalStack sont appelées par leur nom d'hôte, écrit par
# local/init_aws.py dans function_urls.conf ($function_url_host, $origin_secret).

include /etc/nginx/generated/function_urls.conf;

# Les blocs "location /api/" appellent une Function URL comme le fait CloudFront :
# en-tête secret ajouté et Host remplacé par celui de la fonction
# (politique Managed-AllViewerExceptHostHeader).
upstream localstack {
    server localstack:4566;
}

server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_set_header Host $function_url_host;
        proxy_set_header X-Origin-Verify $origin_secret;
        proxy_read_timeout 60s;
        proxy_pass http://localstack;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8082;
    root /usr/share/nginx/html;
    index index.html;

    # Routage par méthode (comme la CloudFront Function de hybrid.tf) : les lectures
    # (GET, HEAD) vont à la Lambda de lecture, toutes les écritures à l'EC2 + RDS.
    location /api/ {
        error_page 418 = @ec2;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 418;
        }
        proxy_set_header Host $function_url_host;
        proxy_set_header X-Origin-Verify $origin_secret;
        proxy_read_timeout 60s;
        proxy_pass http://localstack;
    }

    location @ec2 {
        proxy_set_header X-Shop hybrid;
        proxy_pass http://app-hybrid:8081;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
